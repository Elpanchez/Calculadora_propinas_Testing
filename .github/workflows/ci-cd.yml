name: CI/CD Python - TDD y BDD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Ejecutar pruebas TDD y BDD
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest behave

      - name: Ejecutar pruebas TDD (pytest)
        run: pytest CalculadoraPropinasTDD/

      - name: Ejecutar pruebas BDD (behave)
        run: behave CalculadoraPropinasBDD/

  deploy:
    name: Simular despliegue
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Simular despliegue en entorno de pruebas
        run: echo "Aplicación desplegada en entorno de pruebas (simulado)"